name: Bug report
description: Unexpected behavior that is not a hard crash
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Solpaper.

        **Do not** include OAuth tokens, callback URLs, Calendar event titles, emails, or full `C:\\Users\\...` paths.
        Security vulnerabilities → root `SECURITY.md`, not this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Solpaper version / build / commit
      description: From Settings → Diagnostics when available.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 24H2 build from winver
    validations:
      required: true
  - type: textarea
    id: error_codes
    attributes:
      label: Error codes / categories
      description: From Diagnostics only (codes, not event titles).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed tokens, OAuth URLs, Calendar titles, and full personal paths from this report
          required: true

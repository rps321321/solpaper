name: Crash report
description: Process exit, panic, or startup crash loop
title: "crash: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for hard crashes or startup loops.

        **Do not** paste stack traces that contain tokens, home-directory paths, or Calendar content.
        Prefer a previewed diagnostic bundle over raw logs.
        Security vulnerabilities → root `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: When it crashed (startup, idle, action).
    validations:
      required: true
  - type: dropdown
    id: safe_mode
    attributes:
      label: Safe mode offered or active?
      options:
        - "Unknown"
        - "No"
        - "Yes — I used safe mode"
        - "Yes — I declined safe mode"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Solpaper version / build / commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version (winver)
    validations:
      required: true
  - type: textarea
    id: frequency
    attributes:
      label: Frequency
      description: Once, every launch, three times in five minutes, etc.
    validations:
      required: true
  - type: textarea
    id: error_codes
    attributes:
      label: Error codes from Diagnostics
      description: Codes and categories only.
  - type: checkboxes
    id: bundle
    attributes:
      label: Diagnostic bundle
      options:
        - label: I can attach a previewed diagnostic bundle if maintainers ask (no tokens/titles/raw DB)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed tokens, OAuth URLs, Calendar titles, and full personal paths from this report
          required: true

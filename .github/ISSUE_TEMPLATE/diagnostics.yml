name: Diagnostics / support data
description: Non-sensitive health info or questions about Diagnostics
title: "diagnostics: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For questions about Diagnostics, bundles, or log policy.

        **Do not** upload raw databases, Credential Manager exports, or Calendar dumps.
        Security vulnerabilities → root `SECURITY.md`.
  - type: textarea
    id: question
    attributes:
      label: Question or observation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Solpaper version / build / commit
  - type: textarea
    id: health
    attributes:
      label: Health snapshot (optional)
      description: Safe fields only — version, safe_mode, error codes, monitor_count, last sync “ok/never” (no titles).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included tokens, OAuth URLs, Calendar titles, or full personal paths
          required: true

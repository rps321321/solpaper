# Release-artifact build check (not a public release).
# Public signing and stable publication remain human-only (CRITICAL).
# Policy: docs/engineering/ci-policy.md
name: Release build check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release-build:
    name: Windows release build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release

      - name: Release build (workspace)
        run: cargo build --workspace --release

      - name: Upload solpaper binary (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: solpaper-windows-x64-unsigned
          path: target/release/solpaper.exe
          if-no-files-found: error
          retention-days: 14
          # Never attach secrets, Calendar data, or signing material.

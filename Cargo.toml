[workspace]
resolver = "2"
members = [
    "crates/solpaper-app",
    "crates/solpaper-core",
    "crates/solpaper-windows",
    "crates/solpaper-storage",
]
# Disposable spikes stay outside the production workspace.
exclude = ["spikes/desktop-overlay"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.80"

[workspace.dependencies]
# version + path so cargo-deny can resolve workspace members (not bare wildcards).
solpaper-core = { path = "crates/solpaper-core", version = "0.1.0" }
solpaper-storage = { path = "crates/solpaper-storage", version = "0.1.0" }
solpaper-windows = { path = "crates/solpaper-windows", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

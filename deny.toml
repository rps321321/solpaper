# cargo-deny configuration for Solpaper.
# Policy authority: docs/security/supply-chain.md and
# docs/engineering/deterministic-execution-blueprint.md § #38
# Issue: https://github.com/rps321321/solpaper/issues/38

[graph]
targets = [
    "x86_64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# Critical and high advisories fail the check (cargo-deny default severity handling).
# Every ignore entry MUST record reason, owner, linked issue, and expiry in
# docs/security/supply-chain.md § Advisory waivers — do not silence silently.
ignore = []

[licenses]
# Blueprint #38 DEFAULT allow list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
# MPL-2.0 and OFL-1.1 require human review/exception (add crate-scoped exceptions only).
exceptions = []

[licenses.private]
# Workspace crates set publish = false; ignore their own license field for deny graph.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies require immutable commit + separate justification (supply-chain.md).
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
